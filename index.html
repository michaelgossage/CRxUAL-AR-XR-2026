<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>The Creative Transformation Awards 2026 — AR Experience</title>
  <link rel="stylesheet" href="/src/styles.css" />

  <!-- 8th Wall Engine (self-hosted) -->
  <script async src="/xr/xr.js" data-preload-chunks="slam"></script>
  <script src="https://cdn.8thwall.com/web/xrextras/xrextras.js"></script>
  <script src="https://cdn.8thwall.com/web/coaching-overlay/coaching-overlay.js"></script>
</head>
<body>
  <!-- AR Canvas Container -->
  <div id="ar-container">
    <canvas id="ar-canvas"></canvas>
  </div>

  <!-- Loading Screen -->
  <div id="loading-screen">
    <div class="home-bg" aria-hidden="true">
      <div class="home-bg-track home-bg-track--a">
        <img src="./targets/compiled/BeNotAfraid-RysiaAnnaKaczmar2_thumbnail.png" alt="">
        <img src="./targets/compiled/Birdcage-JichuZhang/Birdcage-JichuZhang_thumbnail.jpg" alt="">
        <img src="./targets/compiled/BlackSwan-JieunSung/BlackSwan-JieunSung_thumbnail.jpg" alt="">
        <img src="./targets/compiled/Dehumanized-ChiAnChou2_thumbnail.png" alt="">
        <img src="./targets/compiled/EMBODIED-VeepraMishra/EMBODIED-VeepraMishra_thumbnail.jpg" alt="">
        <img src="./targets/compiled/EmbodiedMemories-YoonJuChung/EmbodiedMemories-YoonJuChung_thumbnail.jpg" alt="">
        <img src="./targets/compiled/FauxFlora-JustinaAlexandroff/FauxFlora-JustinaAlexandroff_thumbnail.jpg" alt="">
        <img src="./targets/compiled/LetMeEatCake-SuzannaTeal/LetMeEatCake-SuzannaTeal_thumbnail.jpg" alt="">
        <img src="./targets/compiled/BeNotAfraid-RysiaAnnaKaczmar2_thumbnail.png" alt="">
        <img src="./targets/compiled/Birdcage-JichuZhang/Birdcage-JichuZhang_thumbnail.jpg" alt="">
        <img src="./targets/compiled/BlackSwan-JieunSung/BlackSwan-JieunSung_thumbnail.jpg" alt="">
        <img src="./targets/compiled/Dehumanized-ChiAnChou2_thumbnail.png" alt="">
        <img src="./targets/compiled/EMBODIED-VeepraMishra/EMBODIED-VeepraMishra_thumbnail.jpg" alt="">
        <img src="./targets/compiled/EmbodiedMemories-YoonJuChung/EmbodiedMemories-YoonJuChung_thumbnail.jpg" alt="">
        <img src="./targets/compiled/FauxFlora-JustinaAlexandroff/FauxFlora-JustinaAlexandroff_thumbnail.jpg" alt="">
        <img src="./targets/compiled/LetMeEatCake-SuzannaTeal/LetMeEatCake-SuzannaTeal_thumbnail.jpg" alt="">
      </div>
      <div class="home-bg-track home-bg-track--b">
        <img src="./targets/compiled/LustFeelsLikeBadLuck-JuliaPytko2_thumbnail.png" alt="">
        <img src="./targets/compiled/MarieSaintYves/MarieSaintYves_thumbnail.jpg" alt="">
        <img src="./targets/compiled/MaterialPlace-NeveBeill2_thumbnail.png" alt="">
        <img src="./targets/compiled/Nailed-GenevieveCarr/Nailed-GenevieveCarr_thumbnail.jpg" alt="">
        <img src="./targets/compiled/NoLongerUs-JunShya/NoLongerUs-JunShya_thumbnail.jpg" alt="">
        <img src="./targets/compiled/Pseudosynthesis-LeonLin2_thumbnail.png" alt="">
        <img src="./targets/compiled/Self-Finish-BeatriceElAsmar2_thumbnail.png" alt="">
        <img src="./targets/compiled/Symbion-ShuyangWang_thumbnail.png" alt="">
        <img src="./targets/compiled/LustFeelsLikeBadLuck-JuliaPytko2_thumbnail.png" alt="">
        <img src="./targets/compiled/MarieSaintYves/MarieSaintYves_thumbnail.jpg" alt="">
        <img src="./targets/compiled/MaterialPlace-NeveBeill2_thumbnail.png" alt="">
        <img src="./targets/compiled/Nailed-GenevieveCarr/Nailed-GenevieveCarr_thumbnail.jpg" alt="">
        <img src="./targets/compiled/NoLongerUs-JunShya/NoLongerUs-JunShya_thumbnail.jpg" alt="">
        <img src="./targets/compiled/Pseudosynthesis-LeonLin2_thumbnail.png" alt="">
        <img src="./targets/compiled/Self-Finish-BeatriceElAsmar2_thumbnail.png" alt="">
        <img src="./targets/compiled/Symbion-ShuyangWang_thumbnail.png" alt="">
      </div>
    </div>
    <div class="loading-content">
      <h1 class="loading-title">The Creative Transformation Awards 2026</h1>
      <div class="loading-bar-track">
        <div class="loading-bar-fill" id="loading-bar"></div>
      </div>
      <p class="loading-status" id="loading-status">Initializing…</p>
      <div class="cta-pair" id="cta-pair" style="display:none;">
        <button class="btn-scan" id="start-button">Scan and Discover</button>
        <a class="btn-exhibition" id="exhibition-link" href="http://virtual-exhibition.chancery-rosewood-ual.com" target="_blank" rel="noopener">Full Exhibition</a>
      </div>
    </div>
  </div>

  <!-- Scanning Hint -->
  <div id="scanning-hint" style="display:none;">
    <div class="scan-indicator">
      <div class="scan-corners"></div>
    </div>
    <p class="scan-text">Point at an artwork to begin</p>
  </div>

  <!-- Artwork Header (top bar, slides in when artwork is found) -->
  <div id="artwork-header" class="artwork-header hidden" style="display:none;">
    <div class="artwork-header-content">
      <a id="artwork-title-link" class="artwork-title"></a>
      <p id="artwork-artist" class="artwork-artist"></p>
    </div>
    <button id="artwork-close" class="artwork-close" aria-label="Close">&times;</button>
  </div>

  <!-- Description Drawer (slide-up tab at bottom) -->
  <div id="description-drawer" class="description-drawer hidden" style="display:none;">
    <div class="drawer-handle" id="drawer-handle">
      <div class="drawer-pill"></div>
      <div class="drawer-handle-row">
        <span class="drawer-label">About this work</span>
        <span class="drawer-chevron">&#8593;</span>
      </div>
    </div>
    <div class="drawer-content-inner">
      <div class="drawer-content">
        <div id="drawer-nav" class="drawer-nav" style="display:none;">
          <button id="drawer-prev" class="drawer-nav-btn" aria-label="Previous">&#8592;</button>
          <button id="drawer-next" class="drawer-nav-btn" aria-label="Next">&#8594;</button>
        </div>
        <p id="artwork-description" class="artwork-description"></p>
      </div>
    </div>
  </div>

  <!-- Exhibition Bar (persistent bottom bar, shown once AR starts) -->
  <div id="exhibition-bar" class="exhibition-bar hidden" style="display:none;">
    <a id="exhibition-bar-link" class="exhibition-bar-link" href="http://virtual-exhibition.chancery-rosewood-ual.com" target="_blank" rel="noopener">Explore the Full Exhibition</a>
  </div>

  <!-- Error Screen -->
  <div id="error-screen" style="display:none;">
    <div class="error-content">
      <h2 class="error-title" id="error-title">Something went wrong</h2>
      <p class="error-message" id="error-message"></p>
      <button class="error-action" id="error-action" style="display:none;">Retry</button>
    </div>
  </div>

  <!-- Desktop QR Redirect -->
  <div id="desktop-screen" style="display:none;">
    <div class="desktop-content">
      <h1 class="loading-title">The Creative Transformation Awards 2026</h1>
      <p class="desktop-message">This experience requires a mobile device with a camera.</p>
      <div id="qr-placeholder" class="qr-placeholder">
        <p>Open this URL on your phone:</p>
        <p class="url-display" id="url-display"></p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
